name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported: swift-tools-version 5.9.
          - name: oldest
            runner: macos-14
            xcode: /Applications/Xcode_15.2.app
            oracle: false
          # Current: the runner image's default Xcode.
          - name: current
            runner: macos-15
            xcode: ""
            oracle: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        if: matrix.xcode != ''
        run: sudo xcode-select -s "${{ matrix.xcode }}"

      - name: Toolchain
        run: swift --version

      - name: Cache unrar oracle
        if: matrix.oracle
        uses: actions/cache@v4
        with:
          path: Tools/oracle/.build
          key: unrar-${{ runner.os }}-${{ hashFiles('Tools/oracle/build-unrar.sh') }}

      - name: Build unrar oracle
        # Builds RARLAB's UnRAR source as a test oracle only. This leg requires
        # it: SWIFTRAR_REQUIRE_ORACLE makes missing tools or fixtures fail the
        # tests instead of skipping them, so green means the comparisons ran.
        if: matrix.oracle
        run: |
          unrar="$(Tools/oracle/build-unrar.sh --build)"
          echo "SWIFTRAR_UNRAR=$unrar" >> "$GITHUB_ENV"
          echo "SWIFTRAR_REQUIRE_ORACLE=1" >> "$GITHUB_ENV"

      - name: Build
        run: swift build

      - name: Strict concurrency
        # Swift 6 data-race checking on the library and the tests.
        if: matrix.name == 'current'
        run: swift build --build-tests -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

      - name: External sample
        # A separate package that uses only the published products: it must
        # build, list an archive, and extract entries exactly as unrar does.
        if: matrix.name == 'current'
        shell: bash
        run: |
          swift build --package-path Examples/ListAndExtract
          sample=Examples/ListAndExtract/.build/debug/ListAndExtract
          archive=Tests/Fixtures/rar4-s2.rar
          "$sample" "$archive"
          for entry in book/ComicInfo.xml book/pages/page03.jpg; do
            cmp <("$sample" "$archive" "$entry") <("$SWIFTRAR_UNRAR" p -inul "$archive" "$entry")
          done

      - name: SwiftUI example
        # Compiles only; whether the UI stays responsive is checked by hand.
        if: matrix.name == 'current'
        run: swift build --package-path Examples/SwiftUIConvert -Xswiftc -warnings-as-errors

  ios-build:
    # Compiles for the iOS device SDK; no simulator is booted.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build for iOS
        run: >
          xcodebuild build -scheme SwiftRAR
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO

      - name: SwiftUI example for iOS
        working-directory: Examples/SwiftUIConvert
        run: >
          xcodebuild build -scheme SwiftUIConvert
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO

      - name: Documentation
        # DocC catalog plus doc comments; a broken symbol link is a warning
        # in DocC, and fails this step.
        shell: bash
        run: |
          set -o pipefail
          xcodebuild docbuild -scheme SwiftRAR -destination 'generic/platform=macOS' 2>&1 | tee docbuild.log
          if grep -E '\.(md|swift):[0-9]+:[0-9]+: warning:' docbuild.log; then
            echo "::error::DocC warnings"
            exit 1
          fi
