name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# GitHub-hosted runners only. A self-hosted runner must never run pull
# requests from forks: every job here gets a fresh VM, and fork PRs get a
# read-only token and no secrets. A newer push to the same ref cancels the
# run still waiting or running.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported: swift-tools-version 6.2, so Xcode 26.0.1
          # (Swift 6.2) exactly. Pinned: the image's default Xcode moves.
          - name: oldest
            runner: macos-26
            xcode: /Applications/Xcode_26.0.1.app
            experimental: false
          # The next toolchain, to see breakage early. May fail without
          # turning CI red. The xcode-27 image is a preview.
          - name: next
            runner: xcode-27
            xcode: /Applications/Xcode.app
            experimental: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    env:
      DEVELOPER_DIR: ${{ matrix.xcode }}/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache unrar oracle
        # The script's hash is in the key, so a new UnRAR version builds
        # afresh. The script reuses a cached binary.
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/swiftrar-unrar
          key: unrar-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/oracle/build-unrar.sh') }}

      - name: Build unrar oracle
        # Builds RARLAB's UnRAR source as a test oracle only. CI requires it:
        # SWIFTRAR_REQUIRE_ORACLE makes missing tools or fixtures fail the
        # tests instead of skipping them, so green means the comparisons ran.
        env:
          SWIFTRAR_ORACLE_DIR: ${{ runner.temp }}/swiftrar-unrar
        run: |
          unrar="$(Tools/oracle/build-unrar.sh --build)"
          echo "SWIFTRAR_UNRAR=$unrar" >> "$GITHUB_ENV"
          echo "SWIFTRAR_REQUIRE_ORACLE=1" >> "$GITHUB_ENV"

      - name: Build
        # Swift 6 language mode: data races are compile errors.
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Test
        # Release: the PPMd fixtures take minutes in debug, seconds here.
        run: swift test -c release -Xswiftc -enable-testing

      - name: External sample
        # A separate package that uses only the published products: it must
        # build, list an archive, and extract entries exactly as unrar does.
        if: matrix.name == 'oldest'
        shell: bash
        run: |
          swift build --package-path Examples/ListAndExtract
          sample=Examples/ListAndExtract/.build/debug/ListAndExtract
          archive=Tests/Fixtures/rar4-s2.rar
          "$sample" "$archive"
          for entry in book/ComicInfo.xml book/pages/page03.jpg; do
            cmp <("$sample" "$archive" "$entry") <("$SWIFTRAR_UNRAR" p -inul "$archive" "$entry")
          done

      - name: SwiftUI example
        # Compiles only; whether the UI stays responsive is checked by hand.
        if: matrix.name == 'oldest'
        run: swift build --package-path Examples/SwiftUIConvert -Xswiftc -warnings-as-errors

  ios-build:
    # Compiles for the iOS device SDK; no simulator is booted.
    needs: test
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Build for iOS
        run: >
          xcodebuild build -scheme SwiftRAR
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO

      - name: SwiftUI example for iOS
        working-directory: Examples/SwiftUIConvert
        run: >
          xcodebuild build -scheme SwiftUIConvert
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData-example"
          CODE_SIGNING_ALLOWED=NO

      - name: Documentation
        # DocC catalog plus doc comments; a broken symbol link is a warning
        # in DocC, and fails this step.
        shell: bash
        run: |
          set -o pipefail
          xcodebuild docbuild -scheme SwiftRAR -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" 2>&1 | tee docbuild.log
          if grep -E '\.(md|swift):[0-9]+:[0-9]+: warning:' docbuild.log; then
            echo "::error::DocC warnings"
            exit 1
          fi
